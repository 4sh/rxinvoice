steps:
  - name: 'europe-docker.pkg.dev/quatreapp/synechis/build-init'
    args: ['$BUILD_ID']
  - id: 'restore-cache'
    name: 'europe-docker.pkg.dev/quatreapp/synechis/restore_cache'
    volumes:
      - name: 'gradle'
        path: '/gradle'
    args:
      - '--bucket=gs://${_CACHE_BUCKET}'
      - '--key=gradle'
    waitFor: ['-']
  - id: 'build'
    name: 'europe-docker.pkg.dev/quatreapp/synechis/openjdk-slack:8-jdk-slim'
    volumes:
      - name: 'gradle'
        path: '/gradle'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -x
        export STEP_NAME="server"
        ./gradlew --build-cache \
           :srv:build \
           $_REPO_SETTINGS --gradle-user-home=/gradle
    waitFor: ['restore-cache']
  - id: 'save_cache'
    name: 'europe-docker.pkg.dev/quatreapp/synechis/save_cache'
    volumes:
      - name: 'gradle'
        path: '/gradle'
    args:
      - '--bucket=gs://${_CACHE_BUCKET}'
      - '--key=gradle'
      - '--path=/gradle'
    waitFor: ['build']
options:
  env:
    - 'PROJECT_NAME=4SH invoice'
    - 'BUILD_ID=$BUILD_ID'
    - 'BRANCH_NAME=$BRANCH_NAME'
    - 'SLACK_WEBHOOK_URL=$_SLACK_WEBHOOK_URL'
tags: ['build', 'server']
logsBucket: 'gs://synechis_logs/4sh-invoice'

timeout: 600s
substitutions:
  _CACHE_BUCKET: 'qsh-invoice-cicd_cache'
  # _SLACK_WEBHOOK_URL: '' # https://hooks.slack.com/services/<...>/<...>''
  # _REPO_SETTINGS: '-Prepo4shUrl=http://repo.4sh.fr/artifactory -Prepo4shUser=chef -Prepo4shPassword=<..>'
